[tool.poetry]
name = "pulse-bo"
version = "0.1.0"
description = "Constrained Bayesian optimization of pulsed electrodeposition for cobalt selectivity"
authors = ["James Chen <chenjames0723@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "pulse_bo" }]

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^1.26"
pandas = "^2.0"
scipy = "^1.11"
scikit-learn = "^1.3"
openpyxl = "^3.1"          # Excel (.xlsx) IO
matplotlib = "^3.8"        # parity plotting
seaborn = "^0.13"          # parity plotting

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[tool.poetry.scripts]
pulse-bo-parse  = "pulse_bo.cli:parse_main"
pulse-bo-run    = "pulse_bo.cli:run_main"
pulse-bo-parity = "pulse_bo.cli:parity_main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
